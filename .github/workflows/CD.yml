name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]      # must match CI's name: exactly
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted            # runs on the runner on your Production Server
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check cluster is running
        run: |
          minikube status
          kubectl get nodes

      - name: Rolling update to new image
        run: kubectl set image deployment/weather-ml-app weather-ml-app=$IMAGE

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/weather-ml-app --timeout=180s

      - name: Roll back if rollout failed
        if: failure()
        run: kubectl rollout undo deployment/weather-ml-app

      - name: Show deployment state
        run: kubectl get deployments,pods,services -o wide
