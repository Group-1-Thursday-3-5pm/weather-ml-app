name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:v1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Smoke Test
        run: |
          python -m unittest tests.smoke_test

      - name: Run Unit Test
        run: |
          python -m unittest tests.unit_test

      - name: Run Integration Test
        run: |
          python -m unittest tests.integration_test

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE .

      - name: Build Test (launch container)
        run: |
          docker run -d --name test-container $IMAGE
          sleep 10
          docker ps | grep test-container
          docker exec test-container python --version
          docker rm -f test-container

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image to DockerHub
        run: docker push $IMAGE
