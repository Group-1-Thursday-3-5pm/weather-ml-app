- name: Install kubectl and Minikube
  hosts: localhost
  user: ubuntu
  become: yes
  # sum of task that file will try to complete
  tasks:
  # first task is to the latest version of stable kubectl through a text file conztining the latest version and saving it to kube_version
    - name: Get latest stable kubectl version
      ansible.builtin.uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: yes
      register: kube_version
  # Uses that version number to build the download URL, then saves the kubectl program to /usr/local/bin/kubectl with various permissons for different users saved on mode
    - name: Download kubectl binary
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kube_version.content | trim }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'
  #Downloads the Minikube program to /usr/local/bin/minikube and makes it executable.
    - name: Download Minikube binary
      ansible.builtin.get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /usr/local/bin/minikube
        mode: '0755'
  #Lets the ubuntu user run Docker without sudo. Minikube’s Docker driver needs this.
    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: yes
  #Runs kubectl version --client to confirm the install worked, and saves the output. changed_when: false stops it reporting a change since it only reads.
    - name: Verify kubectl
      ansible.builtin.command: kubectl version --client
      register: kubectl_out
      changed_when: false
  #Prints the verify output so it shows in the terminal. This is good for your evidence screenshot.
    - ansible.builtin.debug:
        var: kubectl_out.stdout

- name: Start Minikube
  hosts: localhost
  user: ubuntu
  become: no

  tasks:
  ##Runs minikube start --driver=docker to create the local Kubernetes cluster, using Docker containers as the node. It runs as a normal user because Minikube refuses to use the Docker driver as root.
    - name: Start Minikube with Docker driver
      ansible.builtin.command: minikube start --driver=docker
      register: mk_start
      changed_when: "'Done!' in mk_start.stdout"
  #Runs minikube status to confirm the cluster is running.
    - name: Check Minikube status
      ansible.builtin.command: minikube status
      register: mk_status
      changed_when: false
  #Prints the status so you can show it working.
    - ansible.builtin.debug:
        var: mk_status.stdout
